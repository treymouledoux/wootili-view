[package]
name = "wootili-view"
version = "0.8.0"
edition = "2021"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
wooting-rgb-rust = { path = "vendor/wooting-rgb-rust" }
eframe = { workspace = true }
image = "0.25.10"
xcap = "0.9.10"
egui-notify = "0.24.0"
scorched = "0.7.0"
serde = { version = "1.0.219", features = ["derive"] }
ron = "0.12.3"
libloading = "0.9.0"
ver-cmp = "0.1.4"

[workspace]
members = ["plugins/update_check"]
default-members = ["."]
resolver = "2"

[workspace.dependencies]
eframe = "0.37.0"
